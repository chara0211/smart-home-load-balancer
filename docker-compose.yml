name: smart-home-load-balancer

services:
  # ======================
  # Base de données PostgreSQL
  # ======================
  postgres:
    image: postgres:16
    container_name: smart-home-load-balancer-postgres
    environment:
      POSTGRES_DB: smarthome
      POSTGRES_USER: smarthome
      POSTGRES_PASSWORD: smarthome
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smarthome"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smart-home-load-balancer-network

  # ======================
  # Message Broker RabbitMQ
  # ======================
  rabbitmq:
    image: rabbitmq:3-management
    container_name: smart-home-load-balancer-rabbitmq
    ports:
      - "5672:5672"    # port AMQP pour Spring
      - "15672:15672"  # interface web
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smart-home-load-balancer-network

  # ======================
  # Usage Collector Service
  # ======================
  usage-collector-service:
    build:
      context: ./usage-collector-service
      dockerfile: Dockerfile
    container_name: smart-home-load-balancer-usage-collector-service
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - smart-home-load-balancer-network
    restart: unless-stopped
    labels:
      - "com.smarthome.project=smart-home-load-balancer"
      - "com.smarthome.service=usage-collector-service"

  # ======================
  # Peak Detector Service
  # ======================
  peak-detector-service:
    build:
      context: ./peak-detector-service
      dockerfile: Dockerfile
    container_name: smart-home-load-balancer-peak-detector
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      rabbitmq:
        condition: service_healthy
      usage-collector-service:
        condition: service_started
    networks:
      - smart-home-load-balancer-network
    restart: unless-stopped
    labels:
      - "com.smarthome.project=smart-home-load-balancer"
      - "com.smarthome.service=peak-detector-service"

  # ======================
  # Device Simulator Service
  # ======================
  device-simulator-service:
    build:
      context: ./device-simulator-service
      dockerfile: Dockerfile
    container_name: smart-home-load-balancer-device-simulator
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - smart-home-load-balancer-network
    restart: unless-stopped
    labels:
      - "com.smarthome.project=smart-home-load-balancer"
      - "com.smarthome.service=device-simulator-service"

  # ======================
  # Optimizer Service
  # ======================
  optimizer-service:
    build:
      context: ./optimizer-service
      dockerfile: Dockerfile
    container_name: smart-home-load-balancer-optimizer-service
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - smart-home-load-balancer-network
    restart: unless-stopped
    labels:
      - "com.smarthome.project=smart-home-load-balancer"
      - "com.smarthome.service=optimizer-service"

  # ======================
  # Billing Service (NEW!)
  # ======================
  billing-service:
    build:
      context: ./billing-service
      dockerfile: Dockerfile
    container_name: smart-home-load-balancer-billing-service
    ports:
      - "8086:8086"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # Morocco ONEE electricity rates (MAD/kWh, including 14% TVA)
      BILLING_TIER1_RATE: 1.06
      BILLING_TIER2_RATE: 1.22
      BILLING_TIER3_RATE: 1.35
      BILLING_TIER4_RATE: 1.61
      BILLING_SUBSCRIPTION: 10.00
      BILLING_TAX_RATE: 0.14
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      usage-collector-service:
        condition: service_started
    networks:
      - smart-home-load-balancer-network
    restart: unless-stopped
    labels:
      - "com.smarthome.project=smart-home-load-balancer"
      - "com.smarthome.service=billing-service"

volumes:
  postgres_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  smart-home-load-balancer-network:
    name: smart-home-load-balancer-network
    driver: bridge