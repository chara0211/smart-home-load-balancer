spring.application.name=usage-collector-service
server.port=8083

# PostgreSQL - Configuration Kubernetes
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:postgres-service}:${POSTGRES_PORT:5432}/${POSTGRES_DATABASE:smarthome}
spring.datasource.username=${POSTGRES_USERNAME:smarthome}
spring.datasource.password=${POSTGRES_PASSWORD:smarthome}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# RabbitMQ - Configuration Kubernetes
spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq-service}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# JSON converter
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Keycloak OAuth2 Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_URL:http://keycloak-service:8080}/realms/${KEYCLOAK_REALM:smarthome}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_URL:http://keycloak-service:8080}/realms/${KEYCLOAK_REALM:smarthome}/protocol/openid-connect/certs

# Health Check Configuration
# Exclure Keycloak des health checks pour éviter les erreurs 503
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db,rabbit
management.endpoint.health.group.liveness.include=livenessState
management.health.rabbit.enabled=true
management.health.db.enabled=true

# Actuator endpoints
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized

# Logging
logging.level.org.springframework.amqp=INFO
logging.level.com.smarthome=INFO
logging.level.org.springframework.security=DEBUG


