spring.application.name=usage-collector-service
server.port=8083

# PostgreSQL - Utilise le nom du service Docker
spring.datasource.url=jdbc:postgresql://postgres:5432/smarthome
spring.datasource.username=smarthome
spring.datasource.password=smarthome
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# RabbitMQ - Utilise le nom du service Docker
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# JSON converter
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Logging
logging.level.org.springframework.amqp=INFO
logging.level.com.smarthome=DEBUG

