apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: smarthome
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: 'smarthome'
        environment: 'production'
    
    scrape_configs:
      # Prometheus itself
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
      
      # Kubernetes API server
      - job_name: 'kubernetes-apiservers'
        kubernetes_sd_configs:
          - role: endpoints
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: default;kubernetes;https
      
      # Kubernetes nodes
      - job_name: 'kubernetes-nodes'
        kubernetes_sd_configs:
          - role: node
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
      
      # Kubernetes pods
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name
      
      # Microservices
      - job_name: 'usage-collector-service'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - smarthome
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: usage-collector-service
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: http
      
      - job_name: 'peak-detector-service'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - smarthome
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: peak-detector-service
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: http
      
      - job_name: 'device-simulator-service'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - smarthome
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: device-simulator-service
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: http
      
      - job_name: 'optimizer-service'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - smarthome
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: optimizer-service
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: http
      
      # RabbitMQ
      - job_name: 'rabbitmq'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - smarthome
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: rabbitmq-service
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: management
        metrics_path: /api/metrics
      
      # PostgreSQL (via postgres_exporter if deployed)
      - job_name: 'postgres'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - smarthome
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: postgres-service

