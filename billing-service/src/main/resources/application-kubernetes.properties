spring.application.name=billing-service
server.port=8086

# PostgreSQL - Configuration Kubernetes
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres-service:5432/smarthome}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:smarthome}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:smarthome}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# RabbitMQ - Configuration Kubernetes
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:rabbitmq-service}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}

# JSON converter
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Keycloak OAuth2 Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_URL:http://keycloak-service:8080}/realms/${KEYCLOAK_REALM:smarthome}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_URL:http://keycloak-service:8080}/realms/${KEYCLOAK_REALM:smarthome}/protocol/openid-connect/certs

# Billing rates
billing.tier1.rate=${BILLING_TIER1_RATE:1.06}
billing.tier2.rate=${BILLING_TIER2_RATE:1.22}
billing.tier3.rate=${BILLING_TIER3_RATE:1.35}
billing.tier4.rate=${BILLING_TIER4_RATE:1.61}
billing.subscription=${BILLING_SUBSCRIPTION:10.00}
billing.tax.rate=${BILLING_TAX_RATE:0.14}

# Health Check Configuration
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
management.health.startupState.enabled=true
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db,rabbit
management.endpoint.health.group.liveness.include=livenessState
management.health.rabbit.enabled=true
management.health.db.enabled=true

# Actuator endpoints
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized

# Logging
logging.level.org.springframework.amqp=INFO
logging.level.com.smarthome.billing=INFO
logging.level.org.springframework.security=DEBUG

