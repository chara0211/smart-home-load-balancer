spring.application.name=peak-detector-service
server.port=8084

# RabbitMQ - Configuration Kubernetes
spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq-service}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Base URL du Usage Collector (Kubernetes)
usage.collector.base-url=${USAGE_COLLECTOR_URL:http://usage-collector-service:8083}

# Keycloak OAuth2 Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_URL:http://keycloak-service:8080}/realms/${KEYCLOAK_REALM:smarthome}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_URL:http://keycloak-service:8080}/realms/${KEYCLOAK_REALM:smarthome}/protocol/openid-connect/certs

# Health Check Configuration
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
management.health.startupState.enabled=true
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,rabbit
management.endpoint.health.group.liveness.include=livenessState
management.health.rabbit.enabled=true

# Actuator endpoints
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized

# Logging
logging.level.org.springframework.amqp=INFO
logging.level.com.smarthome=INFO
logging.level.org.springframework.security=DEBUG


